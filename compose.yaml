# rep0rter stack: one worker that runs the hourly cycle, one static file
# server for rep0rter.observe.tw. Bound to localhost only; the cloudflared
# tunnel (managed in the Cloudflare dashboard) forwards the public hostname
# to 127.0.0.1:18090.
name: rep0rter

services:
  worker:
    build: .
    image: rep0rter
    container_name: rep0rter-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - REP0RTER_DATA_DIR=/data
    volumes:
      - ${REP0RTER_DATA_HOST_DIR:-./data}:/data
    command: ["loop", "--interval", "3600"]

  web:
    image: caddy:2-alpine
    container_name: rep0rter-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:18090:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${REP0RTER_DATA_HOST_DIR:-./data}/site:/srv:ro
