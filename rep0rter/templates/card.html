{% set palette = card_palettes.get(theme|default("light"), card_palettes.light) %}
<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; }
body { margin: 0; font-family: "Noto Sans CJK TC", "Noto Sans CJK JP", "Noto Sans CJK KR", sans-serif; }
.card { width:1200px; height:630px; background:{{ palette.canvas }}; padding:28px; color:{{ palette.ink }}; }
.paper { height:100%; border-radius:24px; background:{{ palette.surface }}; padding:32px; position:relative; overflow:hidden; }
.identity { display:flex; align-items:center; gap:22px; border-bottom:2px solid {{ palette.line }}; padding-bottom:28px; }
.avatar { width:82px; height:82px; border-radius:24px; object-fit:cover; flex-shrink:0; background:{{ palette.avatar }}; display:flex; align-items:center; justify-content:center; font-size:40px; }
.byline { min-width:0; }
.author { font-size:29px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.source { font-size:20px; color:{{ palette.muted }}; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.quote { font-size:34px; line-height:48px; margin:24px 8px 0; white-space:pre-wrap; overflow-wrap:anywhere; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:6; overflow:hidden; }
.footer { position:absolute; bottom:30px; left:36px; right:36px; display:flex; align-items:center; justify-content:space-between; gap:24px; font-size:18px; color:{{ palette.muted }}; }
.brand { font-size:26px; font-weight:700; color:{{ palette.accent }}; max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.provenance { min-width:0; font-size:16px; }
.permalink { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:800px; margin-top:6px; }
</style></head><body>
<div class="card"><div class="paper">
  <div class="identity">
    {% if avatar %}<img class="avatar" src="{{ avatar }}" alt="">{% else %}<div class="avatar">{{ initial }}</div>{% endif %}
    <div class="byline"><div class="author">{{ author }}</div><div class="source">{{ source }} · #{{ channel }}</div></div>
  </div>
  <div class="quote">{{ original }}</div>
  <div class="footer"><div class="provenance">ORIGINAL EXCERPT · {{ date }}<div class="permalink">{{ url }}</div></div><span class="brand">{{ brand }}</span></div>
</div></div>
</body></html>
