name: Threads authentication
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the read-only check dependencies
        run: python -m pip install 'requests>=2.32,<3' 'python-dotenv>=1.0,<2'
      - name: Verify the configured identity without publishing
        env:
          REP0RTER_THREADS_ACCESS_TOKEN: ${{ secrets.REP0RTER_THREADS_ACCESS_TOKEN }}
          REP0RTER_THREADS_USER_ID: ${{ vars.REP0RTER_THREADS_USER_ID }}
          PYTHONPATH: .
        run: python cloudflare/check_threads.py
