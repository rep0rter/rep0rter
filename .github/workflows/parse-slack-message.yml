name: Manual backup export of g0v Slack messages

# rep0rter runs hourly on its own host (see compose.yaml). This workflow is a
# manual fallback that exports the last N days of public Slack messages to
# messages.json as a workflow artifact. It does not push to the repository.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Collect and export
        env:
          DAYS: ${{ github.event.inputs.days || '7' }}
          REP0RTER_DATA_DIR: ./data
        run: |
          python -m rep0rter collect --days "$DAYS"
          python -m rep0rter export --days "$DAYS" --out messages.json

      - uses: actions/upload-artifact@v4
        with:
          name: messages-json
          path: messages.json
          retention-days: 30
